<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" /><stop offset="1" stop-color="#0f2a1a" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .layer { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: print 0.35s linear forwards; }
    @keyframes print { to { transform: scaleX(1); } }
    .head { animation: sweep 0.7s ease-in-out infinite alternate; }
    @keyframes sweep { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="280" rx="14" fill="url(#bg)" />
  <rect width="1200" height="280" rx="14" fill="url(#grid)" opacity="0.6" />

  <text x="70" y="118" font-size="64" font-weight="800" fill="#ffffff">Emanuele Tech</text>
  <text x="72" y="160" font-size="22" fill="#9ca3af">3D printing · Digital innovation &amp; AI · Electric vehicles</text>
  <text x="72" y="214" font-size="18" font-family="ui-monospace, 'Fira Code', Menlo, monospace" fill="#00d455">$ make things --open-source<tspan class="blink">▌</tspan></text>

  <!-- printer frame -->
  <g stroke="#374151" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M900 250 V40 H1120 V250" />
    <path d="M890 250 H1130" />
  </g>
  <line x1="900" y1="70" x2="1120" y2="70" stroke="#374151" stroke-width="3" />
  <rect x="920" y="240" width="180" height="6" rx="3" fill="#374151" />
  <g class="head">
    <rect x="985" y="58" width="50" height="34" rx="5" fill="#374151" />
    <path d="M1002 92 h16 l-8 14 z" fill="#00d455" />
  </g>
  <g>
    <rect class="layer" x="956" y="232" width="108" height="7" rx="2" fill="#00d455" style="animation-delay:0.00s; opacity:0.45" />
    <rect class="layer" x="953" y="223" width="114" height="7" rx="2" fill="#00d455" style="animation-delay:0.35s; opacity:0.49" />
    <rect class="layer" x="950" y="214" width="120" height="7" rx="2" fill="#00d455" style="animation-delay:0.70s; opacity:0.53" />
    <rect class="layer" x="947" y="205" width="126" height="7" rx="2" fill="#00d455" style="animation-delay:1.05s; opacity:0.57" />
    <rect class="layer" x="944" y="196" width="132" height="7" rx="2" fill="#00d455" style="animation-delay:1.40s; opacity:0.61" />
    <rect class="layer" x="941" y="187" width="138" height="7" rx="2" fill="#00d455" style="animation-delay:1.75s; opacity:0.65" />
    <rect class="layer" x="938" y="178" width="144" height="7" rx="2" fill="#00d455" style="animation-delay:2.10s; opacity:0.69" />
    <rect class="layer" x="935" y="169" width="150" height="7" rx="2" fill="#00d455" style="animation-delay:2.45s; opacity:0.73" />
    <rect class="layer" x="938" y="160" width="144" height="7" rx="2" fill="#00d455" style="animation-delay:2.80s; opacity:0.77" />
    <rect class="layer" x="941" y="151" width="138" height="7" rx="2" fill="#00d455" style="animation-delay:3.15s; opacity:0.81" />
    <rect class="layer" x="944" y="142" width="132" height="7" rx="2" fill="#00d455" style="animation-delay:3.50s; opacity:0.85" />
    <rect class="layer" x="947" y="133" width="126" height="7" rx="2" fill="#00d455" style="animation-delay:3.85s; opacity:0.89" />
    <rect class="layer" x="950" y="124" width="120" height="7" rx="2" fill="#00d455" style="animation-delay:4.20s; opacity:0.93" />
    <rect class="layer" x="953" y="115" width="114" height="7" rx="2" fill="#00d455" style="animation-delay:4.55s; opacity:0.97" />
  </g>
</svg>