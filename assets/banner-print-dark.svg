    @keyframes lift {
      0%, 69.048% { transform: translateY(0); animation-timing-function: cubic-bezier(.55,0,.9,.6); }
      88.095%, 89.286% { transform: translateY(-300px); }
      89.405%, 100% { transform: translateY(0); }
